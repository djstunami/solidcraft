<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="620" viewBox="0 0 760 620">
  <title>grazing-ray</title>
  <g id="Layer_1" data-name="Layer 1">
    <rect x="0" y="0" width="760" height="620" fill="#ffffff"/>
    <circle cx="380" cy="420" r="230" fill="none" stroke="#dce9f5" stroke-width="28" stroke-miterlimit="10"/>
    <circle cx="380" cy="420" r="230" fill="none" stroke="#1f6fb2" stroke-width="3" stroke-miterlimit="10"/>
    <line x1="380" y1="420" x2="180.814" y2="535" fill="none" stroke="#999999" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="6 4"/>
    <circle cx="380" cy="420" r="3" fill="#555555"/>
    <text transform="matrix(1 0 0 1 290 500)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">r = 1/κ</tspan></text>
    <line x1="90" y1="190" x2="730" y2="190" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10"/>
    <circle cx="90" cy="190" r="4" fill="#000000"/>
    <circle cx="380" cy="190" r="4" fill="#000000"/>
    <text transform="matrix(1 0 0 1 80 176)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">P, the point classified (outside)</tspan></text>
    <text transform="matrix(1 0 0 1 700 180)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">ray</tspan></text>
    <text transform="matrix(1 0 0 1 180 120)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">T, where the ray touches the rim</tspan></text>
    <line x1="362" y1="124" x2="377" y2="183" fill="none" stroke="#555555" stroke-width="0.75" stroke-miterlimit="10"/>
    <line x1="299.75" y1="160" x2="299.75" y2="230" fill="none" stroke="#999999" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4 3"/>
    <line x1="460.25" y1="160" x2="460.25" y2="230" fill="none" stroke="#999999" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4 3"/>
    <line x1="299.75" y1="224" x2="460.25" y2="224" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10"/>
    <text transform="matrix(1 0 0 1 303.75 244)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">|s| ≤ √(2·tol/κ): within tol</tspan></text>
    <line x1="397.46" y1="196.502" x2="557.217" y2="254.621" fill="none" stroke="#999999" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="8 4"/>
    <text transform="matrix(1 0 0 1 520 120)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">a ray at angle θ, sin θ = √(2·tol·κ):</tspan></text>
    <text transform="matrix(1 0 0 1 520 136)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">its sagitta θ²/(2κ) is tol</tspan></text>
    <line x1="585" y1="142" x2="553.579" y2="248.57" fill="none" stroke="#555555" stroke-width="0.75" stroke-miterlimit="10"/>
    <line x1="152" y1="300" x2="176.814" y2="305" fill="none" stroke="#555555" stroke-width="0.75" stroke-miterlimit="10"/>
    <text transform="matrix(1 0 0 1 20 300)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">the rim, a curved edge,</tspan></text>
    <text transform="matrix(1 0 0 1 20 316)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">and its tolerance band</tspan></text>
    <text transform="matrix(1 0 0 1 20 36)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000"><tspan x="0" y="0">A ray that grazes a curved edge</tspan></text>
    <text transform="matrix(1 0 0 1 20 62)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">Its direction across the edge at T is below what the tolerance resolves (3.8e-6 in #22582),</tspan></text>
    <text transform="matrix(1 0 0 1 20 78)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">so the edge cannot say which side the ray leaves on: the hit is refused and the next ray is fired.</tspan></text>
    <text transform="matrix(1 0 0 1 20 584)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">Plan view of the cap plane;</tspan></text>
    <text transform="matrix(1 0 0 1 20 600)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">tol drawn far larger than it is.</tspan></text>
  </g>
</svg>
